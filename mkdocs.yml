site_name: fairness_training
site_description: Guaranteed fairness constraints for PyTorch neural networks via differentiable optimization layers
site_author: David Troxell
repo_url: https://github.com/dtroxell19/fairness_training
repo_name: fairness_training

theme:
  name: material
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - content.tabs.link
    - content.code.copy
    - content.code.annotate
  icon:
    repo: fontawesome/brands/github

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: google
            show_source: true
            show_root_heading: true
            members_order: source

markdown_extensions:
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.arithmatex:
      generic: true
  - admonition
  - pymdownx.details
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true

extra_javascript:
  - javascripts/mathjax.js
  - https://polyfill.io/v3/polyfill.min.js?features=es6
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js

nav:
  - Home: index.md
  - Getting Started:
    - Installation: getting-started/installation.md
    - Quickstart: getting-started/quickstart.md
  - User Guide:
    - Core Concepts: user-guide/concepts.md
    - Fairness Metrics: user-guide/fairness-metrics.md
    - Training Models: user-guide/training.md
    - Inference: user-guide/inference.md
    - Custom Metrics: user-guide/custom-metrics.md
    - Visualization: user-guide/visualization.md
  - Examples:
    - Large-Batch Inference: examples/large-batch.md
    - Small-Batch Inference: examples/small-batch.md
  - API Reference:
    - FairModel: api/fair-model.md
    - FairTrainer: api/fair-trainer.md
    - Fairness Metrics: api/fairness-metrics.md
    - Utilities: api/utils.md