[build-system]
requires = ["setuptools>=65", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[project]
name = "fairness_training"
version = "0.1.0"
description = "Guaranteed fairness constraints for PyTorch neural networks via differentiable optimization layers."
readme = "README.md"
authors = [
    { name = "David Troxell", email = "davidtroxell@g.ucla.edu" }
]
license = "MIT"
requires-python = ">=3.9"
keywords = ["fairness", "machine learning", "deep learning", "pytorch", "cvxpy", "constrained optimization"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Operating System :: OS Independent",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = []

[project.optional-dependencies]

full = [
    "torch==2.6.0",
    "torchvision==0.21.0",
    "torch-geometric==2.6.1",

    "numpy==2.2.4",
    "scipy==1.15.2",

    "cvxpy==1.6.5",
    "cvxpylayers>=0.1.6",
    "ecos==2.0.14",
    "diffcp>=1.1.5",

    "datasets==3.5.0",
    "transformers==4.50.3",
    "openml>=0.15.1",
    "openai>=1.77.0",
    "opencv-python==4.11.0.86",
    "scikit-image>=0.25.2",
    "seaborn>=0.13.2",
    "tensorboard>=2.19.0",
    "pycocotools>=2.0.8",
    "cog>=0.14.4",
]

train = [
    "torch==2.6.0",
    "torchvision==0.21.0",
    "numpy==2.2.4",
    "scipy==1.15.2",
    "transformers==4.50.3",
]

verify = [
    "cvxpy==1.6.5",
    "cvxpylayers>=0.1.6",
    "ecos==2.0.14",
    "diffcp>=1.1.5",
]

cpu = [
    "torch==2.6.0; platform_system!='Windows'",
    "numpy==2.2.4",
]

dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "black>=25.9.0",
]

viz = [
    "matplotlib>=3.7",
]

[project.urls]
Homepage = "https://github.com/dtroxell19/fairness_training"
Issues = "https://github.com/dtroxell19/fairness_training/issues"
Changelog = "https://github.com/dtroxell19/fairness_training/blob/main/CHANGELOG.md"

[tool.pytest.ini_options]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
]